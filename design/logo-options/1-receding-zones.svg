<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Horizon">
  <!-- Receding zones: the board's columns, Today first and tallest, later
       zones shorter and quieter, all standing on one baseline. Position
       means time. -->
  <rect width="64" height="64" rx="14" fill="#FBFAF6"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#DDD9CF"/>
  <rect x="9" y="11" width="13" height="40" rx="4" fill="#2F5BD3"/>
  <rect x="26" y="21" width="11" height="30" rx="3.5" fill="#4B4F57"/>
  <rect x="41" y="30" width="8" height="21" rx="3" fill="#6B6F78"/>
  <rect x="53" y="38" width="5" height="13" rx="2" fill="#CFCBC1"/>
</svg>
